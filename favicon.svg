<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.3" flood-color="#000000" />
    </filter>
  </defs>

  <!-- Background Squircle (App Icon Shape) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.25" />

  <!-- Shield Base (Cyber Guard) -->
  <g filter="url(#drop)">
    <path d="M256 105 L385 155 C385 285 256 385 256 385 C256 385 127 285 127 155 Z" 
          fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round" />

    <!-- Autonomous Bot Eyes -->
    <ellipse cx="205" cy="195" rx="18" ry="14" fill="#38BDF8" filter="url(#glow)" />
    <ellipse cx="205" cy="195" rx="8" ry="6" fill="#FFFFFF" />
    
    <ellipse cx="307" cy="195" rx="18" ry="14" fill="#38BDF8" filter="url(#glow)" />
    <ellipse cx="307" cy="195" rx="8" ry="6" fill="#FFFFFF" />

    <!-- Upward Profit & Candlestick Pulse -->
    <path d="M165 290 L215 310 L256 250 L298 285 L345 190" 
          fill="none" stroke="#34D399" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    <path d="M165 290 L215 310 L256 250 L298 285 L345 190" 
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Peak Signal Rocket Dot -->
    <circle cx="345" cy="190" r="16" fill="#38BDF8" filter="url(#glow)" />
    <circle cx="345" cy="190" r="8" fill="#FFFFFF" />
  </g>

  <!-- Safe Rest / Autonomous Antenna Node -->
  <line x1="256" y1="105" x2="256" y2="60" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <circle cx="256" cy="55" r="20" fill="#34D399" filter="url(#glow)" />
  <circle cx="256" cy="55" r="10" fill="#FFFFFF" />
</svg>
